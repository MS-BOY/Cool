<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Sharing Website</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .video-container {
            padding: 50px;
            flex: 1;
            min-width: 600px;
            max-width: 900px;
            text-align: center;
        }
        .video-container iframe {
            width: 100%;
            height: 400px;
            max-width: 800px;
        }
        .share-buttons {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 24px;
        }
        .material-icons {
            vertical-align: middle;
        }
        .ad-section {
            margin: 20px 0;
            padding: 20px;
            background: #f4f4f4;
        }
        .right-section {
            padding: 20px;
            margin-left: 20px;
            background: #f9f9f9;
            width: 300px;
            min-height: 500px;
        }
    </style>
    <script>
        function copyLink() {
            const dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = window.location.href;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            alert('Link copied to clipboard!');
        }
        function shareOnSocial(media) {
            let url = encodeURIComponent(window.location.href);
            if (media === 'facebook') {
                window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
            } else if (media === 'twitter') {
                window.open(`https://twitter.com/intent/tweet?url=${url}`, '_blank');
            }
        }
    </script>
</head>
<body>
    
    <div class="video-container">
        <h1>Watch Video</h1>
        <iframe src="https://www.youtube.com/embed/2Wlw8dZnlQY" frameborder="0" allowfullscreen></iframe>
        <div class="share-buttons">
            <button onclick="copyLink()"><i class="material-icons">content_copy</i></button>
            <button onclick="shareOnSocial('facebook')"><i class="material-icons">facebook</i></button>
            <button onclick="shareOnSocial('twitter')"><i class="material-icons">share</i></button>
        </div>
    </div>

    <div class="right-section">
        <h2>Suggested Videos</h2>
        <ul>
            <li><a href="#">Video 1</a></li>
            <li><a href="#">Video 2</a></li>
            <li><a href="#">Video 3</a></li>
            <li><a href="#">Video 4</a></li>
        </ul>
        <div class="ad-section">
            <h3>Sponsored Ad</h3>
            <p>Advertisement goes here (e.g., Google AdSense or custom ad).</p>
        </div>
    </div>

</body>
</html>
