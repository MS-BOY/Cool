<html lang="en">

    <title>{{POLL_TITLE}}</title>
    <meta name="description" content="{{POLL_DESCRIPTION}}" />
    <meta name="author" content="MS" />
    <link rel="icon" type="image/png" href="https://cdn0.iconfinder.com/data/icons/content-volume-2/24/poll-1024.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="{{POLL_TITLE}}" />
