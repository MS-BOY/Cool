<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#hero">Home</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="hero" class="hero">
        <div class="hero-content">
            <h1>Welcome to My Portfolio</h1>
            <p>Showcasing my skills and projects.</p>
            <button class="cta-button">Learn More</button>
        </div>
    </section>

    <section id="projects" class="projects">
        <h2>My Projects</h2>
        <div class="project-grid">
            <div class="project">
                <img src="https://source.unsplash.com/random/400x300/?website" alt="Project 1">
                <h3>Project 1</h3>
                <p>A brief description of project 1.</p>
            </div>
            <div class="project">
                <img src="https://source.unsplash.com/random/400x300/?app" alt="Project 2">
                <h3>Project 2</h3>
                <p>A brief description of project 2.</p>
            </div>
            <div class="project">
                <img src="https://source.unsplash.com/random/400x300/?design" alt="Project 3">
                <h3>Project 3</h3>
                <p>A brief description of project 3.</p>
            </div>
        </div>
    </section>

    <section id="contact" class="contact">
        <h2>Contact Me</h2>
        <form>
            <input type="text" placeholder="Your Name">
            <input type="email" placeholder="Your Email">
            <textarea placeholder="Your Message"></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
